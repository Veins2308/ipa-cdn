<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang kết nối CDN Tải IPA Max Speed...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; border-radius: 20px; padding: 32px; max-width: 440px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
        .btn { display: inline-block; margin-top: 18px; padding: 12px 24px; background: #0ea5e9; color: #fff; text-decoration: none; font-weight: 700; border-radius: 12px; }
        code { color: #38bdf8; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h3 id="title">🚀 Đang bắt đầu tải IPA Max Speed...</h3>
        <p id="desc">Hệ thống đang chuyển hướng tới máy chủ GitHub Releases CDN (24/7 Vĩnh Viễn).</p>
        <div id="fileBox"></div>
        <a id="dlBtn" class="btn" href="#">Bấm vào đây nếu trình duyệt chưa tự tải</a>
    </div>
    <script>
        (function() {
            const path = window.location.pathname;
            // Khớp cấu trúc: /<repo>/dl_dec/b<uid>_<sig>/<exp>/<filename>.ipa
            const m = path.match(/\/([^\/]+)\/dl_dec\/(b\d+_[0-9a-fA-F]+)\/(\d+)\/([^\/]+\.ipa)$/i);
            const parts = window.location.hostname.split('.');
            const owner = parts[0];
            if (m) {
                const repo = m[1];
                const exp = parseInt(m[3], 10);
                const filename = m[4];
                const now = Math.floor(Date.now() / 1000);
                if (exp > 0 && now > exp) {
                    document.getElementById('title').innerText = '⚠️ Link tải đã hết hạn';
                    document.getElementById('desc').innerText = 'Vui lòng quay lại Bot Telegram để lấy link giải mã mới.';
                    return;
                }
                const releaseUrl = `https://github.com/${owner}/${repo}/releases/download/ipa-cache/${filename}`;
                document.getElementById('fileBox').innerHTML = `<code>${filename}</code>`;
                document.getElementById('dlBtn').href = releaseUrl;
                window.location.replace(releaseUrl);
            } else {
                document.getElementById('title').innerText = '📦 Kho Lưu Trữ IPA CDN 24/7';
                document.getElementById('dlBtn').href = 'https://t.me/veins_dec_bot';
                document.getElementById('dlBtn').innerText = 'Mở Bot Telegram @veins_dec_bot';
            }
        })();
    </script>
</body>
</html>
