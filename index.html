<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Đang tải IPA đã giải mã (cryptid = 0)...</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}.card{background:#1e293b;border-radius:20px;padding:32px;max-width:460px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)}.btn{display:inline-block;margin-top:18px;padding:12px 24px;background:#0ea5e9;color:#fff;text-decoration:none;font-weight:700;border-radius:12px}code{color:#38bdf8;word-break:break-all}</style></head><body><div class="card"><h3 id="title">🚀 Đang kết nối máy chủ tải IPA tốc độ tối đa...</h3><p id="desc">Trình duyệt sẽ tự động tải file IPA sạch (cryptid = 0) ngay lập tức.</p><div id="fileBox"></div><a id="dlBtn" class="btn" href="#">Bấm vào đây nếu trình duyệt chưa tự tải</a></div><script>(async function(){const path=window.location.pathname;const m=path.match(/\/([^\/]+)\/dl_dec\/(b\d+_[0-9a-fA-F]+)\/(\d+)\/([^\/]+\.ipa)$/i);const owner=window.location.hostname.split('.')[0];if(!m){document.getElementById('dlBtn').href='https://t.me/veins_dec_bot';document.getElementById('dlBtn').innerText='Mở Bot @veins_dec_bot';return;}const repo=m[1];const exp=parseInt(m[3],10);const filename=m[4];const now=Math.floor(Date.now()/1000);if(exp>0&&now>exp){document.getElementById('title').innerText='⚠️ Link tải đã hết hạn';return;}document.getElementById('fileBox').innerHTML=`<code>${filename}</code>`;let targetUrl=`https://raw.githubusercontent.com/${owner}/${repo}/main/ipas/${filename}`;try{const res=await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/manifest.json?t=${now}`);if(res.ok){const manifest=await res.json();if(manifest.files&&manifest.files[filename]){targetUrl=manifest.files[filename];}}}catch(e){}document.getElementById('dlBtn').href=targetUrl;window.location.replace(targetUrl);})();</script></body></html>
